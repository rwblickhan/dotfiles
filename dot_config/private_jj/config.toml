# :schema https://docs.jj-vcs.dev/latest/config-schema.json

[[--scope]]
--when.repositories = ["/workspaces/obsidian"]
[--scope.user]
email = "russell.blickhan@vanta.com"

[user]
email = "rwb@rwblickhan.org"
name = "Russell Blickhan"

[ui]
diff-formatter = "delta"
default-command = "log"

[merge-tools]
delta.diff-expected-exit-codes = [0, 1]

[templates]
draft_commit_description = '''
  concat(
    coalesce(description, default_commit_description, "\n"),
    surround(
      "\nJJ: This commit contains the following changes:\n", "",
      indent("JJ:     ", diff.stat(72)),
    ),
    "\nJJ: ignore-rest\n",
    diff.git(),
  )
'''

[revset-aliases]
# Set all remote bookmarks to be immutable
'immutable_heads()' = "builtin_immutable_heads() | remote_bookmarks()"
'mine()' = 'author_email(exact:"rwb@rwblickhan.org") | author_email(exact:"russell.blickhan@vanta.com")'
'branch_heads()' = 'heads(mine() & mutable()) ~ descendants(immutable() & ~::trunk())'
'branch_roots()' = 'roots(mutable() & ::branch_heads())'
'closest_bookmark(to)' = 'heads(::to & bookmarks())'
'closest_pushable(to)' = 'heads(::to & mutable() & ~description(exact:"") & (~empty() | merges()))'
'mutable_ancestors(x)' = '::x & mutable()'
'undescribed_ancestors(x)' = 'mutable_ancestors(x) & description(exact:"")'
# stack(x, n) is the set of mutable commits reachable from 'x',
# with 'n' parents. 'n' is often useful to customize the display
# and return set for certain operations. 'x' can be used to target
# the set of 'roots' to traverse, e.g. @ is the current stack.
'stack()' = 'stack(@)'
'stack(x)' = 'stack(x, 2)'
'stack(x, n)' = 'ancestors(reachable(x, mutable()), n)'

[revsets]
bookmark-advance-to = 'closest_pushable(@)'
log = 'present(@) | ancestors(immutable_heads().., 2) | present(trunk()) | bookmarks()'

[aliases]
# Squash the whole branch into its oldest mutable change
collapse = ["squash", "--from", "mutable_ancestors(@)", "--into", "roots(mutable_ancestors(@))"]
# Generate a bookmark from change description
branch = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
set -e
rev="${1:-@}"
desc=$(jj log -r "$rev" --no-graph -T 'description.first_line()')
# Slugify the first description line into a git-ref-safe bookmark name:
# lowercase, collapse non-alphanumerics to hyphens, trim leading/trailing hyphens.
name=$(printf '%s' "$desc" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
if [ -z "$name" ]; then
  echo "Change $rev has no description to derive a bookmark name from." >&2
  exit 1
fi
name="russell-$name"
jj bookmark set "$name" -r "$rev"
echo "$name"
""",
  "branch",
]
# Init a colocated jj repo and track main
init = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
jj git init --colocate
# Track main by default
jj bookmark track main --remote=origin
""",
]
# Merge the latest main into the current change
merge = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
set -e
jj git fetch
jj new @ 'main@origin' -m "${1:-Merge main}"
names=$(jj log -r 'heads(::@ & bookmarks() & ~::(main@origin))' --no-graph --no-pager -T 'local_bookmarks.join(" ") ++ " "')
if [ -n "${names// /}" ]; then
  jj bookmark advance $names
else
  echo "No branch bookmark below @; skipped bookmark advance." >&2
fi
""",
  "merge",
]
# Open a PR from an unpushed change
pr = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
set -e
rev="${1:-@}"
name=$(jj branch "$rev")
env PRE_COMMIT_REMOTE_URL="$(git remote get-url origin)" jj-hp push -b "$name"
gh pr create --head "$name"
""",
  "pr",
]
# Fetch remote changes and rebase fully-mutable branches
pull = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
set -e
jj git fetch
jj rebase -s 'branch_roots()' -o 'trunk()'
jj new main
""",
]
# Push a branch
push = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
set -e
jj bookmark advance "$@"
if [ -z "${JJ_PUSH_ALLOW_FOREIGN:-}" ]; then
  foreign=$(jj log -r '(trunk()..@) ~ mine()' --no-graph --no-pager -T builtin_log_oneline)
  if [ -n "$foreign" ]; then
    echo "Refusing to push: commits you did not author sit between trunk() and @:" >&2
    echo "$foreign" >&2
    echo "Rebase onto trunk() with 'jj pull', or set JJ_PUSH_ALLOW_FOREIGN=1 to override." >&2
    exit 1
  fi
fi
env PRE_COMMIT_REMOTE_URL="$(git remote get-url origin)" jj-hp push
""",
  "push",
]
# Run hk's fix mode against each mutable revision's own diff (via `jj run`,
# since hk fix mutates real files in place rather than working over
# jj fix's stdin/stdout tool protocol)
run-hk = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
set -e
rev="${1:-reachable(@, mutable())}"
jj run -r "$rev" -- sh -c 'hk fix --from-ref $(jj log -r "parents($JJ_CHANGE_ID)" --no-graph -T commit_id) --to-ref $JJ_COMMIT_ID --no-progress --quiet --no-stage'
""",
  "run-hk",
]

[jj-hooks]
advance-bookmarks = true
